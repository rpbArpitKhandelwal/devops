apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/devops-cicd-kubernetes-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
