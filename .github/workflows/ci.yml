name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devops-cicd-kubernetes-lab:ci

      - name: Smoke test container
        run: |
          docker run -d --name order-service-smoke -p 8000:8000 devops-cicd-kubernetes-lab:ci
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            sleep 3
          done
          curl --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/orders
          docker logs order-service-smoke
          docker rm -f order-service-smoke
